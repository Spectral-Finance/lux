[package]
name = "lux-rs"
version = "0.1.0"
edition = "2021"
description = "Rust core for Lux multi-agent framework"
license = "MIT"

[dependencies]
# Testing
proptest = "1.4"           # Property-based testing
criterion = "0.5"          # Benchmarking
mockall = "0.12"           # Mocking

# Core utilities
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Test fixtures
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[lib]
name = "lux_rs"
path = "src/lib.rs"

[[bin]]
name = "lux-rs-test"
path = "src/bin/test_runner.rs"

[profile.release]
lto = true
codegen-units = 1
