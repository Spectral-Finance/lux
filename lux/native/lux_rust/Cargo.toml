[package]
name = "lux_rust"
version = "0.1.0"
authors = ["Spectral Finance <dev@spectral.finance>"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "lux_rust"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.31", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1