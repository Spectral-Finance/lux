[package]
name = "lux_rust"
version = "0.1.0"
edition = "2021"
authors = ["Lux Contributors"]
description = "Rust NIF bindings for Lux framework"

[lib]
name = "lux_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
