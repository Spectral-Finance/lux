[package]
name = "lux_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust core for Lux framework — high-performance NIF bindings"

[lib]
name = "lux_native"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
