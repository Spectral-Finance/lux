[package]
name = "lux_rust"
version = "0.1.0"
edition = "2021"
authors = ["Spectral Finance Contributors"]
description = "Rust NIF bindings for Lux framework"
license = "MIT"

[lib]
name = "lux_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
