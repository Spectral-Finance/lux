[package]
name = "lux-rust"
version = "0.1.0"
edition = "2021"
description = "Rust core components for the Lux framework"
license = "MIT"
authors = ["Robert Parcus <robertparcus@spectrallabs.xyz>"]

[lib]
name = "lux_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "my_benchmark"
harness = false
