[package]
name = "lux_core"
version = "0.1.0"
edition = "2021"
description = "Rust core integration for the Lux framework - high-performance data processing and aggregation"
license = "MIT"
authors = ["Spectral Finance <team@spectrallabs.xyz>"]
repository = "https://github.com/Spectral-Finance/lux"
readme = "README.md"

[lib]
name = "lux_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false
