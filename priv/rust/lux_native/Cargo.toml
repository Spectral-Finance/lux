[package]
name = "lux_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust extensions for Lux: high-performance computations via Rustler NIFs"

[lib]
name = "lux_native"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.31", features = ["serde_rustler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
