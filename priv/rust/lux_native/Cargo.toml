[package]
name = "lux_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust extensions for Lux"

[lib]
name = "lux_native"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.35", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
