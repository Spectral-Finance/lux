
[package]
name = "lux_rust"
version = "0.1.0"
edition = "2021"
description = "Rust native code for Lux - high-performance FFI bindings"

[lib]
name = "lux_rust"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
