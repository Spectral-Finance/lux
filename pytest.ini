[pytest]
# Root-level config so `pytest -q` works from the repository root.
# Adds the Python package dir to sys.path so `import lux` and `import erlport`
# resolve, and runs the suite without the coverage plugin (which may not be
# installed everywhere).
pythonpath = lux/priv/python
testpaths =
    lux/priv/python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q