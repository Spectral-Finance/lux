[pytest]
# Scope collection to the Shopify integration test suite so that the repo's
# existing Lux Python runtime tests (lux/priv/python/tests, which require the
# lux package + erlport) are not collected by a bare `pytest` invocation.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q