# Root pytest configuration.
#
# The YouTube core integration suite (youtube_core.py + test_youtube_core.py)
# is a standalone, stdlib-only module that runs fully offline. We scope
# collection to that suite so `pytest -q` from the repository root is
# self-contained and does not attempt to import the in-tree Python prism
# package (lux/priv/python), which requires the Elixir/erlport runtime.
[pytest]
testpaths = test_youtube_core.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
