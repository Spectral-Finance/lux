[pytest]
# Root pytest configuration for the TradingView TA integration (issue #86).
#
# The legacy suite under ``lux/priv/python/tests`` is executed from within the
# ``lux/priv/python`` working directory (where ``lux`` is importable as a
# package) and is intentionally excluded here so that a bare ``pytest`` from the
# repository root runs the self-contained, offline TradingView TA suite.
testpaths = lux/test/python
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q