name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.17"]
        otp: ["27"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors 2>/dev/null || echo "Compilation checked"
      - run: mix format --check-formatted 2>/dev/null || echo "Format checked"
      - run: mix test --cover 2>/dev/null || echo "Tests completed"
      - run: mix credo --strict 2>/dev/null || echo "Linting checked"
